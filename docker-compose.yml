name: multimo

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multimo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-multimo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./multimo-backend
      dockerfile: manifest/docker/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: multimo-backend:local
    restart: unless-stopped
    env_file: .env
    environment:
      # Container-internal values override the local-dev ones in .env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      HTTP_ADDR: ":8000"
      DATA_DIR: /data
      TESTDATA_DIR: /testdata
      DETECTOR_BASE_URL: ${DETECTOR_BASE_URL_DOCKER:-http://detector:8000}
    volumes:
      - appdata:/data
      - ./testdata:/testdata:ro
    depends_on:
      postgres:
        condition: service_healthy
      detector:
        condition: service_healthy
        required: false
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEM_LIMIT:-4g}

  # VisDrone object detector (CPU by default; docker-compose.gpu.yml adds a GPU).
  # Weights are downloaded into the detector-models volume on first start.
  detector:
    build:
      context: ./detector
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    image: multimo-detector:local
    restart: unless-stopped
    environment:
      # Weights under /weights come from detector/weights in the repository
      # (Git LFS); /models is a volume for downloaded weights.
      DETECTOR_WEIGHTS: ${DETECTOR_WEIGHTS:-/models/visdrone.pt}
      DETECTOR_WEIGHTS_URL: ${DETECTOR_WEIGHTS_URL-https://huggingface.co/dronefreak/visdrone-yolov9e/resolve/main/best.pt}
      DETECTOR_MODEL_NAME: ${DETECTOR_MODEL:-visdrone-yolov9e}
      DETECTOR_IMGSZ: ${DETECTOR_IMGSZ:-1024}
      DETECTOR_SCALES: ${DETECTOR_SCALES:-}
      DETECTOR_CONF: ${DETECTOR_CONF:-0.57}
      DETECTOR_API_KEY: ${DETECTOR_API_KEY:-}
    volumes:
      - ./detector/weights:/weights:ro
      - detector-models:/models
    deploy:
      resources:
        limits:
          memory: ${DETECTOR_MEM_LIMIT:-6g}

  frontend:
    build:
      context: ./multimo-frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: multimo-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  appdata:
  detector-models:
